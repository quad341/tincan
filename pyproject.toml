[project]
name = "tincan"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
tincand-mcp = "tincand.mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
